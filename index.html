<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const theme = localStorage.getItem("vite-ui-theme");

        const resolved =
          theme === "system" || !theme
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;

        document.documentElement.classList.add(resolved);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Elias Sørensen is a full-stack developer working with React, TypeScript, C#, and .NET. Explore selected projects and get in touch."
    />
    <meta name="theme-color" content="#171717" />
    <meta property="og:title" content="Elias Sørensen — Full-stack developer" />
    <meta
      property="og:description"
      content="Selected full-stack projects built with React, TypeScript, C#, and .NET."
    />
    <meta property="og:type" content="website" />
    <title>Elias Sørensen — Full-stack developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
